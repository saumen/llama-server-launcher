# Set model specific settings in the presets.
# Set server level settings in launcher-inkling-2-mini.sh
# Recommended settings: https://unsloth.ai/docs/models/inkling-2-mini
# Sampling: temperature=1.0, top-p=1.0, top-k=0, min-p=0.0
# Root GGUFs need the Unsloth sibling build. Mainline llama.cpp cannot read them yet.
# Do not point model at Mainline_Support files. That layout is for upstream llama.cpp.
########################################################################################################################

[*]
ctx-size = 262144

cache-type-k = q8_0
cache-type-v = q8_0

temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0

# DSpark drafter. Not an MTP head. Do not set spec-type to draft-mtp.
# https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/blob/main/dspark/README.md
spec-type = draft-dspark
spec-draft-n-max = 3
model-draft = /home/saumen/.cache/huggingface/hub/unsloth/Inkling-2-Mini-GGUF/dspark-Inkling-2-Mini-Q8_0.gguf
mmproj = /home/saumen/.cache/huggingface/hub/unsloth/Inkling-2-Mini-GGUF/mmproj-F16.gguf

[unsloth/Inkling-2-Mini-UD-Q8_K_XL]
model = /home/saumen/.cache/huggingface/hub/unsloth/Inkling-2-Mini-GGUF/Inkling-2-Mini-UD-Q8_K_XL.gguf
alias = inkling-2-mini-ud-q8-k-xl

[unsloth/Inkling-2-Mini-UD-Q4_K_XL]
model = /home/saumen/.cache/huggingface/hub/unsloth/Inkling-2-Mini-GGUF/Inkling-2-Mini-UD-Q4_K_XL.gguf
alias = inkling-2-mini-ud-q4-k-xl
