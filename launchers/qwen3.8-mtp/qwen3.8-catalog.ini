# Set model specific settings in the presets.
# Set server level settings in the `../launcher-qwen3.8.sh`
########################################################################################################################
# Recommended settings: https://unsloth.ai/docs/models/qwen3.8#recommended-settings
# Qwen3.8-27B is a hybrid thinking model with different defaults per mode:
#   Thinking:  temp=1.0, top-p=0.95, top-k=20, min-p=0.0, presence-penalty=0.0, repeat-penalty=1.0
#   Instruct:  temp=0.7, top-p=0.80, top-k=20, min-p=0.0, presence-penalty=1.5, repeat-penalty=1.0
########################################################################################################################

[*]
ctx-size = 262144

cache-type-k = q8_0
cache-type-v = q8_0

top-k = 20
min-p = 0.0
repeat-penalty = 1.0

# Speculation
# Qwen3.8-27B is a dense Qwen3.5-family model with an MTP head embedded in the
# main GGUF (draft-mtp uses the MTP module in-file; no separate drafter file).
spec-type = draft-mtp
spec-draft-n-max = 3
draft-p-min = 0.50
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0

########################################################################################################################
# General - Thinking
########################################################################################################################

[unsloth/Qwen3.8-27B-UD-Q5_K_XL-General]
model = /home/saumen/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/fe1e2a23d973adb629709749dc4f6756df66ef10/Qwen3.8-27B-UD-Q5_K_XL.gguf
alias = unsloth/qwen3.8-27b-general

reasoning = on

temperature = 1.0
top-p = 0.95
presence-penalty = 0.0

########################################################################################################################
# Instruct - Non-thinking
########################################################################################################################

[unsloth/Qwen3.8-27B-UD-Q5_K_XL-NT]
model = /home/saumen/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/fe1e2a23d973adb629709749dc4f6756df66ef10/Qwen3.8-27B-UD-Q5_K_XL.gguf
alias = unsloth/qwen3.8-27b-it

reasoning = off

temperature = 0.7
top-p = 0.80
presence-penalty = 1.5
